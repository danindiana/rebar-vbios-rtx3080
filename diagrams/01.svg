<text text-anchor="middle" x="435" y="-189.2" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#721c24">Key insight:</text>
<text text-anchor="middle" x="435" y="-177.2" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#721c24">Silicon always supported 8 GiB BAR1.</text>
<text text-anchor="middle" x="435" y="-165.2" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#721c24">Firmware suppressed it for 6–18 months.</text>
<text text-anchor="middle" x="435" y="-153.2" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#721c24">VBIOS update = policy release, not</text>
<text text-anchor="middle" x="435" y="-141.2" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#721c24">technical breakthrough.</text>
</g>
